<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mushroom Explosion — Finale Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/ender.css">
  <style>
    html, body { margin: 0; height: 100%; background: #06100e; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
    #enderScene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    /* studio bar */
    #studio { position: fixed; left: 0; right: 0; bottom: 0; z-index: 300; display: flex; flex-direction: column; gap: 9px;
      padding: 11px 16px 13px; background: rgba(7,11,13,0.9); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.12); color: #e8eaed; font: 500 12px/1.3 'Inter', sans-serif; user-select: none; }
    #studio .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #studio button { font: 600 12px/1 'Inter', sans-serif; color: #e8eaed; background: #262b31; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px; padding: 7px 11px; cursor: pointer; }
    #studio button:hover { background: #323840; }
    #studio button.on { background: #f5c451; color: #14150f; border-color: #f5c451; }
    #play { min-width: 74px; background: #2ad6c4; color: #062018; border-color: #2ad6c4; }
    #scrub { flex: 1; min-width: 200px; height: 22px; }
    #time { font: 700 12px/1 ui-monospace, Menlo, monospace; color: #f5c451; min-width: 118px; text-align: right; }
    #beat { color: #9fb; font-weight: 600; min-width: 150px; }
    .lbl { color: #8b9096; margin-left: 6px; }
    .beats button { background: #1d2228; font-size: 11px; padding: 6px 9px; }
    .hint { color: #6b7076; font-size: 11px; }
    kbd { background: #2a3037; border-radius: 4px; padding: 1px 5px; font: 600 10px/1.4 ui-monospace, monospace; color: #cfd3d7; }
  </style>
</head>
<body>
  <canvas id="enderScene"></canvas>
  <div class="ender-overlay" id="enderOverlay"></div>

  <div id="studio">
    <div class="row">
      <button id="play">▶ Play</button>
      <input id="scrub" type="range" min="0" max="100" step="0.02" value="0">
      <span id="time">0.00 / 0.00s</span>
    </div>
    <div class="row">
      <span id="beat">—</span>
      <span class="lbl">step</span>
      <button data-step="-1">⟵ 1f</button>
      <button data-step="1">1f ⟶</button>
      <button data-step="-6">−0.25s</button>
      <button data-step="6">+0.25s</button>
      <span class="lbl">speed</span>
      <button class="spd on" data-spd="1">1×</button>
      <button class="spd" data-spd="0.5">0.5×</button>
      <button class="spd" data-spd="0.25">0.25×</button>
      <button class="spd" data-spd="0.1">0.1×</button>
      <button id="cam">🎥 Free cam</button>
      <button id="boom">💥 Jump to blast</button>
      <span class="hint"><kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> step · <kbd>R</kbd> restart</span>
    </div>
    <div class="row beats" id="beats"></div>
  </div>

  <script type="module">
    await import('./pieces.js');                                   // sets window.PIECES / window.BOARD3D
    const { createEnderScene } = await import('./ender-scene.js');
    const canvas = document.getElementById('enderScene');
    const view = await createEnderScene(canvas);
    view.resize();
    window.__ender = view;
    const dur = view.duration;

    // ---- overlays (mirror ender.js: fade-cut veil, whiteout flash, final CTA) ----
    const mk = (cls) => { const d = document.createElement('div'); d.className = cls; document.body.appendChild(d); return d; };
    const cut = mk('ender-cut'), flash = mk('ender-flash'), cta = mk('ender-cta');
    cta.innerHTML =
      '<div class="ender-cta-in">' +
        '<div class="ender-cta-kick">The why behind every move</div>' +
        '<h2 class="ender-cta-h">Your games hide<br>moments <span class="am">like that</span>.</h2>' +
        '<p class="ender-cta-p">StockThink reviews any game the way a grandmaster would &mdash; surfacing every brilliancy and blunder, and the idea that turned it. Free, in your browser.</p>' +
        '<a class="ender-cta-btn" href="/">Analyse my game &rarr;</a>' +
      '</div>';

    // ---- studio state ----
    let t = 0, playing = false, speed = 1, last = performance.now();
    const $ = (s) => document.querySelector(s);
    const scrub = $('#scrub'), timeEl = $('#time'), beatEl = $('#beat'), playBtn = $('#play');
    scrub.max = dur.toFixed(2);

    const scenes = view.scenes || [];
    const beatName = (t) => { let n = '—'; for (const s of scenes) if (t >= s.start - 0.001) n = s.label; return n; };

    // beat-jump buttons
    const beatsWrap = $('#beats');
    scenes.forEach((s, i) => { const b = document.createElement('button'); b.textContent = (i + 1) + '. ' + s.label;
      b.onclick = () => { setT(s.start); }; beatsWrap.appendChild(b); });

    function setT(v) { t = Math.max(0, Math.min(dur, v)); scrub.value = t; }
    function drawOverlays(t) {
      if (view.cutFadeAt) cut.style.opacity = String(view.cutFadeAt(t));
      if (view.flashAt) { const fa = view.flashAt(t); flash.style.opacity = String(fa);
        if (fa > 0 && view.flashGrowAt) { const R = view.flashGrowAt(t) * 165; flash.style.background = 'radial-gradient(circle at 50% 54%, #fff 0%, #fff ' + (R * 0.5).toFixed(1) + '%, rgba(255,255,255,0) ' + R.toFixed(1) + '%)'; } }
      if (view.ctaAt) { const c = view.ctaAt(t); cta.style.opacity = String(c); cta.style.pointerEvents = c > 0.5 ? 'auto' : 'none'; }
    }

    // ---- play / pause ----
    function setPlaying(p) { playing = p; playBtn.textContent = p ? '❚❚ Pause' : '▶ Play'; playBtn.classList.toggle('on', p); }
    playBtn.onclick = () => setPlaying(!playing);
    scrub.addEventListener('input', () => { setPlaying(false); t = +scrub.value; });
    document.querySelectorAll('[data-step]').forEach((b) => b.onclick = () => { setPlaying(false); setT(t + (+b.dataset.step) / 24); });
    document.querySelectorAll('.spd').forEach((b) => b.onclick = () => { speed = +b.dataset.spd;
      document.querySelectorAll('.spd').forEach((x) => x.classList.toggle('on', x === b)); });
    $('#boom').onclick = () => { setPlaying(false); setT(dur - 8.4); };

    // ---- free camera (OrbitControls via the scene's director mode) ----
    let cam = null, camOn = false;
    $('#cam').onclick = async () => {
      if (!cam) { const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
        cam = new OrbitControls(view.camera, canvas); cam.enableDamping = true; }
      camOn = !camOn; cam.enabled = camOn; if (view.setDirector) view.setDirector(camOn);
      $('#cam').classList.toggle('on', camOn); if (camOn) cam.target.copy(view.lookTarget);
    };

    // ---- keyboard ----
    addEventListener('keydown', (e) => {
      if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
      else if (e.key === 'ArrowRight') { setPlaying(false); setT(t + (e.shiftKey ? 6 : 1) / 24); }
      else if (e.key === 'ArrowLeft') { setPlaying(false); setT(t - (e.shiftKey ? 6 : 1) / 24); }
      else if (e.key === 'r' || e.key === 'R') { setT(0); setPlaying(true); }
    });

    addEventListener('resize', () => view.resize());

    // ---- loop ----
    function loop(now) {
      requestAnimationFrame(loop);
      if (playing) { t += (now - last) / 1000 * speed; if (t >= dur) { t = dur; setPlaying(false); } }
      last = now;
      view.frame(t);
      if (camOn && cam) { cam.update(); view.lookTarget.copy(cam.target); }
      view.render(); drawOverlays(t);
      scrub.value = t; timeEl.textContent = t.toFixed(2) + ' / ' + dur.toFixed(2) + 's';
      beatEl.textContent = beatName(t);
    }
    requestAnimationFrame(loop);
    console.log('[studio] finale ready — duration', dur.toFixed(2), 's · blast at', (dur - 8.4).toFixed(2));
  </script>
</body>
</html>

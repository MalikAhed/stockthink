<!doctype html>
<!-- DEV-ONLY recording studio. Renders ONE cinematic at maximum quality, full-viewport, with no perf
     gating, and exposes window.RB.frame(p) so editor/record.mjs can step deterministic frames and
     screenshot them. Never shipped (lives under record/, not a build input). Open headless only. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StockThink — cinematic studio (dev)</title>
  <!-- Standalone-render bundle (Colab) has no Vite to resolve bare imports, so map `three` + its addons to
       a CDN. unpkg serves the RAW source, so the addons' internal `import 'three'` resolves through this
       same map → one three instance (no dup). Under Vite this map is ignored (Vite rewrites imports first). -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
    }
  }
  </script>
  <style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
    /* the scene canvas fills the viewport; the recorder sets the exact pixel size via the window */
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <script type="module" src="./studio.js"></script>
</body>
</html>

<!DOCTYPE html>
<!-- DEV-only: preview the finale rating lower-third (.ender-cap) over a dark scene, with the real CSS +
     icons, exactly as ender.js builds it — so the HUD look is verified without the heavy WebGL page. -->
<html lang="en"><head><meta charset="UTF-8"><title>badge preview</title>
<link rel="stylesheet" href="../../styles/ender.css">
<style>
  html,body{margin:0;height:100%;background:#060a09;}
  /* fake a finale backdrop so the glass/contrast reads true */
  .bg{position:fixed;inset:0;background:radial-gradient(60% 50% at 50% 42%, #1a2a22 0%, #0a1410 55%, #050807 100%);}
  .row{position:absolute;left:0;right:0;display:flex;justify-content:center;}
  /* stack the four states down the screen for one screenshot (override the shared bottom:13%) */
  #b1{top:6%}  #b2{top:30%}  #b3{top:54%}  #b4{top:78%}
  .ender-cap{position:static;transform:none;opacity:1 !important;}
  /* show two eval-bar states for the screenshot */
  .ender-eval{opacity:1 !important;}
  #ev1{left:8%} #ev2{left:14%}
</style></head>
<body>
<div class="bg"></div>
<div class="row" id="b1"></div>
<div class="row" id="b2"></div>
<div class="row" id="b3"></div>
<div class="row" id="b4"></div>
<script>
const B='/';
const DATA=[
  {rating:'blunder',label:'Blunder',move:'Nxe4',icon:'blunder.svg'},
  {rating:'brilliant',label:'Brilliant',move:'Qd8+',icon:'brilliant.svg'},
  {rating:'doublecheck',label:'Double check',move:'Bg5+',icon:'great.svg'},
  {rating:'mate',label:'Checkmate',move:'Bd8#',icon:null},
];
DATA.forEach((d,i)=>{
  const cap=document.createElement('div'); cap.className='ender-cap r-'+d.rating;
  const ico=document.createElement('img'); ico.className='ender-cap-ico';
  if(d.icon){ico.src=`${B}badges/${d.icon}`;} else {ico.style.display='none';}
  const r=document.createElement('span'); r.className='ender-cap-rating'; r.textContent=d.label;
  const m=document.createElement('span'); m.className='ender-cap-move'; m.textContent=d.move;
  cap.append(ico,r,m);
  document.getElementById('b'+(i+1)).appendChild(cap);
});
// two eval-bar states: the start (+1.3, ~68% white) and the mate (M3, full gold)
[['ev1','+1.3',68,false],['ev2','M3',100,true]].forEach(([id,label,fill,mate])=>{
  const bar=document.createElement('div'); bar.className='ender-eval'+(mate?' ev-mate':''); bar.id=id;
  const f=document.createElement('div'); f.className='ev-fill'; f.style.height=fill+'%';
  const n=document.createElement('div'); n.className='ev-num'; n.textContent=label;
  bar.append(f,n); document.body.appendChild(bar);
});
window.__ready=true;
</script>
</body></html>

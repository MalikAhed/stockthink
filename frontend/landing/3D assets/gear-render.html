<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gear — Studio Render</title>
<style>
  :root{
    --panel-bg:rgba(18,19,22,.92);
    --panel-line:#262a30;
    --ink:#c7ccd2;
    --ink-dim:#7b828b;
    --ink-faint:#454b53;
    --accent:#c9a24b;        /* warm brass, taken from the bore */
    --track:#23272d;
  }
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #c{display:block;width:100vw;height:100vh}

  #cap{position:fixed;left:18px;bottom:16px;color:var(--ink-dim);font-size:11px;
    line-height:1.7;pointer-events:none;letter-spacing:.01em;
    font-family:ui-monospace,Menlo,monospace}
  #cap b{color:var(--accent);font-weight:600}
  #hint{position:fixed;right:18px;bottom:16px;color:var(--ink-faint);font-size:10px;
    letter-spacing:.14em;font-family:ui-monospace,Menlo,monospace}

  #toggle{position:fixed;top:14px;right:14px;z-index:12;background:var(--panel-bg);
    border:1px solid var(--panel-line);border-radius:7px;color:var(--accent);
    font-family:ui-monospace,monospace;font-size:11px;padding:7px 12px;cursor:pointer;
    letter-spacing:.1em;backdrop-filter:blur(8px)}

  #panel{position:fixed;top:0;right:0;height:100vh;width:286px;background:var(--panel-bg);
    backdrop-filter:blur(10px);border-left:1px solid var(--panel-line);overflow-y:auto;
    padding:16px 16px 64px;font-size:11px;color:var(--ink);transition:transform .25s;z-index:10;
    box-sizing:border-box}
  #panel.hidden{transform:translateX(286px)}
  #panel h3{color:var(--ink-dim);font-size:10px;letter-spacing:.16em;margin:20px 0 9px;
    text-transform:uppercase;font-weight:600}
  #panel h3:first-child{margin-top:2px}
  .ctrl{margin:10px 0}
  .ctrl label{display:flex;justify-content:space-between;margin-bottom:5px;
    color:var(--ink-dim);letter-spacing:.01em}
  .ctrl label span{color:var(--ink);font-variant-numeric:tabular-nums;
    font-family:ui-monospace,Menlo,monospace}
  .ctrl input[type=range]{width:100%;height:3px;background:var(--track);border-radius:3px;
    -webkit-appearance:none;appearance:none;cursor:pointer}
  .ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
    border-radius:50%;background:var(--accent);cursor:pointer;
    box-shadow:0 0 0 3px rgba(201,162,75,.18)}
  .ctrl input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;
    background:var(--accent);border:none;cursor:pointer}
  .row{display:flex;gap:18px;align-items:center;margin:11px 0}
  .row label{color:var(--ink-dim);letter-spacing:.01em;cursor:pointer;
    display:flex;align-items:center;gap:7px}
  .row input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}

  #btns{position:fixed;bottom:0;right:0;width:286px;padding:12px 16px;
    background:rgba(12,13,15,.97);border-left:1px solid var(--panel-line);
    border-top:1px solid var(--panel-line);display:flex;gap:8px;box-sizing:border-box;
    z-index:11;transition:transform .25s}
  #panel.hidden ~ #btns{transform:translateX(286px)}
  #btns button{flex:1;padding:9px;border:1px solid var(--panel-line);border-radius:6px;
    background:#16181c;color:var(--ink);font-family:ui-monospace,monospace;font-size:11px;
    letter-spacing:.07em;cursor:pointer;transition:.15s}
  #btns button:hover{background:#1d2025;border-color:var(--accent);color:var(--accent)}
  #copyBtn.copied{background:#1a2a14;border-color:#8ec74a;color:#8ec74a}

  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--ink-dim);font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.1em;
    pointer-events:none;transition:opacity .4s}
  #load.gone{opacity:0}
</style>
<script type="importmap">{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<canvas id="c"></canvas>
<div id="load">LOADING MODEL…</div>
<div id="cap"><b>GEAR</b> · studio three-point · recolored brushed steel
tint #b3bcc8 · sat 0.18 · no gold bore</div>
<div id="hint">DRAG TO ORBIT · SCROLL TO ZOOM</div>
<button id="toggle">⚙ EDIT</button>

<div id="panel">
  <h3>Color</h3>
  <div class="ctrl"><label>Metal tint</label><input type="color" id="s_tint" value="#b3bcc8" style="width:100%;height:26px;background:none;border:1px solid var(--panel-line);border-radius:5px;cursor:pointer;padding:1px"></div>
  <div class="ctrl"><label>Saturation <span id="v_sat">0.18</span></label><input type="range" id="s_sat" min="0.0" max="1.0" step="0.01" value="0.18"></div>
  <div class="ctrl"><label>Tint brightness <span id="v_bright">1.00</span></label><input type="range" id="s_bright" min="0.4" max="1.6" step="0.01" value="1.00"></div>

  <h3>Material finish</h3>
  <div class="ctrl"><label>Roughness add <span id="v_rough">0.00</span></label><input type="range" id="s_rough" min="-0.4" max="0.4" step="0.01" value="0.00"></div>
  <div class="ctrl"><label>Metalness <span id="v_metal">1.00</span></label><input type="range" id="s_metal" min="0.0" max="1.0" step="0.01" value="1.00"></div>
  <div class="ctrl"><label>Env reflection <span id="v_env">1.00</span></label><input type="range" id="s_env" min="0.0" max="2.5" step="0.01" value="1.00"></div>
  <div class="ctrl"><label>Clearcoat (satin) <span id="v_coat">0.25</span></label><input type="range" id="s_coat" min="0.0" max="1.0" step="0.01" value="0.25"></div>
  <div class="ctrl"><label>Base brightness <span id="v_base">1.00</span></label><input type="range" id="s_base" min="0.4" max="1.6" step="0.01" value="1.00"></div>

  <h3>Render</h3>
  <div class="ctrl"><label>Exposure <span id="v_exp">1.00</span></label><input type="range" id="s_exp" min="0.4" max="1.8" step="0.01" value="1.00"></div>
  <div class="ctrl"><label>Bloom <span id="v_bloom">0.06</span></label><input type="range" id="s_bloom" min="0.0" max="0.5" step="0.01" value="0.06"></div>
  <div class="ctrl"><label>Floor shadow <span id="v_floor">0.55</span></label><input type="range" id="s_floor" min="0.0" max="1.0" step="0.01" value="0.55"></div>

  <h3>Lighting</h3>
  <div class="ctrl"><label>Key <span id="v_key">3.40</span></label><input type="range" id="s_key" min="0.0" max="8.0" step="0.1" value="3.40"></div>
  <div class="ctrl"><label>Fill (cool) <span id="v_fill">0.85</span></label><input type="range" id="s_fill" min="0.0" max="3.0" step="0.05" value="0.85"></div>
  <div class="ctrl"><label>Rim (warm) <span id="v_rim">2.60</span></label><input type="range" id="s_rim" min="0.0" max="6.0" step="0.1" value="2.60"></div>
  <div class="ctrl"><label>Top <span id="v_top">1.40</span></label><input type="range" id="s_top" min="0.0" max="5.0" step="0.1" value="1.40"></div>

  <h3>View</h3>
  <div class="row"><label><input type="checkbox" id="cb_spin"> Auto-rotate</label></div>
  <div class="ctrl"><label>Rim hue <span id="v_hue">38°</span></label><input type="range" id="s_hue" min="20" max="55" step="1" value="38"></div>
</div>
<div id="btns">
  <button id="copyBtn">COPY PARAMS</button>
  <button id="resetBtn">RESET</button>
</div>

// ---------- renderer ----------
const canvas = document.getElementById('c');
const r = new THREE.WebGLRenderer({canvas, antialias:true});
r.setPixelRatio(Math.min(devicePixelRatio, 2));
r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping;
r.toneMappingExposure = 1.0;
r.shadowMap.enabled = true;
r.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0.55, 0.25, 3.0);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.4;
controls.maxDistance = 7;
controls.target.set(0, 0, 0);

// ---------- environment (soft studio reflections) ----------
const pmrem = new THREE.PMREMGenerator(r);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;
let ENV_INTENSITY = 1.0;

// ---------- lights: three-point to mirror the 2D reference ----------
// Key: bright, slightly camera-left & high -> broad satin highlight on the face
const keyLight = new THREE.DirectionalLight(0xffffff, 3.4);
keyLight.position.set(-2.2, 2.6, 3.0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 12;
keyLight.shadow.camera.left = -2; keyLight.shadow.camera.right = 2;
keyLight.shadow.camera.top = 2; keyLight.shadow.camera.bottom = -2;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.radius = 6;
scene.add(keyLight);

// Fill: cool, low intensity, camera-right -> lifts shadows without flattening
const fillLight = new THREE.DirectionalLight(0x9fb6d6, 0.85);
fillLight.position.set(3.0, 0.8, 1.5);
scene.add(fillLight);

// Rim: warm, behind-right -> the glowing bronze edge in the reference
const rimLight = new THREE.DirectionalLight(0xffb066, 2.6);
rimLight.position.set(3.4, 1.2, -2.6);
scene.add(rimLight);

// Top: gentle cool top light for the upper bevels
const topLight = new THREE.DirectionalLight(0xcfe0ff, 1.4);
topLight.position.set(0, 4, 0.2);
scene.add(topLight);

const ambient = new THREE.AmbientLight(0x202830, 0.4);
scene.add(ambient);

// ---------- floor (catches the contact shadow) ----------
const floorMat = new THREE.ShadowMaterial({opacity:0.55});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40,40), floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

// ---------- model ----------
const MATS = [];           // all PBR mats so the panel can drive them
let MODEL = null;
const baseColorMul = new THREE.Color(1,1,1);

// Default recolor: cool blue-grey steel sampled from the reference, low saturation
// so the baked gold bore reads as the same grey metal as the body.
const RECOLOR = { sat: 0.18, tint: '#b3bcc8', bright: 1.0 };

function b64ToArrayBuffer(b64){
  const bin = atob(b64); const len = bin.length; const bytes = new Uint8Array(len);
  for(let i=0;i<len;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
loader.parse(b64ToArrayBuffer(GLB_B64), '', (gltf)=>{
  MODEL = gltf.scene;

  // Convert every standard material to physical (adds clearcoat for the satin sheen),
  // but KEEP all the baked maps - that steel + brass look is painted into them.
  MODEL.traverse(o=>{
    if(!o.isMesh) return;
    o.castShadow = true;
    o.receiveShadow = true;
    const s = o.material;
    const p = new THREE.MeshPhysicalMaterial({
      map: s.map || null,
      normalMap: s.normalMap || null,
      roughnessMap: s.roughnessMap || null,
      metalnessMap: s.metalnessMap || null,
      aoMap: s.aoMap || null,
      color: s.color ? s.color.clone() : new THREE.Color(0xffffff),
      metalness: 1.0,
      roughness: s.roughness !== undefined ? s.roughness : 0.5,
      envMapIntensity: 1.0,
      clearcoat: 0.25,
      clearcoatRoughness: 0.35,
    });
    if(p.map) p.map.colorSpace = THREE.SRGBColorSpace;
    p.userData.baseRough = p.roughness;     // remember baked value for the +/- slider
    p.userData.baseColor = p.color.clone();

    // ---- recolor hook: desaturate the baked map (kills the gold, keeps the
    //      brushed-metal detail) then tint to a cool grey-blue. Driven live. ----
    p.userData.uSat   = { value: RECOLOR.sat };
    p.userData.uTint  = { value: new THREE.Color(RECOLOR.tint) };
    p.userData.uBright= { value: RECOLOR.bright };
    p.onBeforeCompile = (sh)=>{
      sh.uniforms.uSat    = p.userData.uSat;
      sh.uniforms.uTint   = p.userData.uTint;
      sh.uniforms.uBright = p.userData.uBright;
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>',
          '#include <common>\nuniform float uSat;\nuniform vec3 uTint;\nuniform float uBright;')
        .replace('#include <map_fragment>',
          `#include <map_fragment>
           {
             float g = dot(diffuseColor.rgb, vec3(0.299,0.587,0.114));
             vec3 desat = mix(vec3(g), diffuseColor.rgb, uSat);
             diffuseColor.rgb = desat * uTint * uBright;
           }`);
    };
    p.needsUpdate = true;

    o.material = p;
    MATS.push(p);
  });

  // center + scale to a consistent framing, drop it onto the floor
  const box = new THREE.Box3().setFromObject(MODEL);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const scale = 1.7 / Math.max(size.x, size.y, size.z);
  MODEL.scale.setScalar(scale);

  const box2 = new THREE.Box3().setFromObject(MODEL);
  const c2 = box2.getCenter(new THREE.Vector3());
  MODEL.position.sub(c2);                       // center at origin
  const minY = box2.min.y - c2.y;
  floor.position.y = minY - 0.001;              // floor just under the gear

  scene.add(MODEL);
  document.getElementById('load').classList.add('gone');
});

// ---------- post: subtle bloom only ----------
const composer = new EffectComposer(r);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.06, 0.5, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  r.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

// =================== CONTROL PANEL ===================
const $ = id => document.getElementById(id);
function bind(sliderId, valId, fn, fmt){
  const s = $(sliderId), v = $(valId);
  const upd = () => { const x = parseFloat(s.value); if(v) v.textContent = (fmt||(n=>n.toFixed(2)))(x); fn(x); };
  s.addEventListener('input', upd); upd();
}

let AUTOSPIN = false;

// Color (recolor hook)
$('s_tint').addEventListener('input', e=>{ MATS.forEach(m=> m.userData.uTint.value.set(e.target.value)); });
bind('s_sat','v_sat', x=>{ MATS.forEach(m=> m.userData.uSat.value = x); });
bind('s_bright','v_bright', x=>{ MATS.forEach(m=> m.userData.uBright.value = x); });

// Material
bind('s_rough','v_rough', x=>{ MATS.forEach(m=>{ m.roughness = THREE.MathUtils.clamp(m.userData.baseRough + x, 0.02, 1); }); }, n=>(n>=0?'+':'')+n.toFixed(2));
bind('s_metal','v_metal', x=>{ MATS.forEach(m=> m.metalness = x); });
bind('s_env','v_env', x=>{ ENV_INTENSITY=x; MATS.forEach(m=> m.envMapIntensity = x); });
bind('s_coat','v_coat', x=>{ MATS.forEach(m=> m.clearcoat = x); });
bind('s_base','v_base', x=>{ MATS.forEach(m=>{ m.color.copy(m.userData.baseColor).multiplyScalar(x); }); });

// Render
bind('s_exp','v_exp', x=>{ r.toneMappingExposure = x; });
bind('s_bloom','v_bloom', x=>{ bloom.strength = x; });
bind('s_floor','v_floor', x=>{ floorMat.opacity = x; });

// Lighting
bind('s_key','v_key',  x=>{ keyLight.intensity = x; });
bind('s_fill','v_fill', x=>{ fillLight.intensity = x; });
bind('s_rim','v_rim',  x=>{ rimLight.intensity = x; });
bind('s_top','v_top',  x=>{ topLight.intensity = x; });

// View
$('cb_spin').addEventListener('change', e=>{ AUTOSPIN = e.target.checked; });
bind('s_hue','v_hue', x=>{ rimLight.color.setHSL(x/360, 0.85, 0.62); }, n=>Math.round(n)+'°');

// toggle panel
$('toggle').addEventListener('click', ()=>{
  const p = $('panel'), b = $('btns');
  const hidden = p.classList.toggle('hidden');
  b.style.transform = hidden ? 'translateX(286px)' : 'translateX(0)';
});

// COPY PARAMS
$('copyBtn').addEventListener('click', ()=>{
  const p = {
    color:{ tint:$('s_tint').value, saturation:+$('s_sat').value, tintBrightness:+$('s_bright').value },
    material:{ roughnessAdd:+$('s_rough').value, metalness:+$('s_metal').value,
               envMapIntensity:+$('s_env').value, clearcoat:+$('s_coat').value,
               baseBrightness:+$('s_base').value },
    render:{ exposure:+$('s_exp').value, bloom:+$('s_bloom').value, floorShadow:+$('s_floor').value },
    lighting:{ key:+$('s_key').value, fill:+$('s_fill').value, rim:+$('s_rim').value,
               top:+$('s_top').value, rimHue:+$('s_hue').value }
  };
  const txt = JSON.stringify(p, null, 2);
  navigator.clipboard.writeText(txt).then(()=>{
    const b=$('copyBtn'); b.textContent='COPIED ✓'; b.classList.add('copied');
    setTimeout(()=>{ b.textContent='COPY PARAMS'; b.classList.remove('copied'); }, 1500);
  }).catch(()=> window.prompt('Copy these parameters:', txt));
});

// RESET
const DEF = { s_sat:0.18,s_bright:1.00, s_rough:0.00,s_metal:1.00,s_env:1.00,s_coat:0.25,s_base:1.00,
  s_exp:1.00,s_bloom:0.06,s_floor:0.55, s_key:3.40,s_fill:0.85,s_rim:2.60,s_top:1.40,s_hue:38 };
$('resetBtn').addEventListener('click', ()=>{
  for(const [id,val] of Object.entries(DEF)){
    const s=$(id); if(s){ s.value=val; s.dispatchEvent(new Event('input')); }
  }
  $('s_tint').value='#b3bcc8'; $('s_tint').dispatchEvent(new Event('input'));
  $('cb_spin').checked=false; AUTOSPIN=false;
});
// =================== END PANEL ===================

function loop(){
  requestAnimationFrame(loop);
  if(AUTOSPIN && MODEL) MODEL.rotation.y += 0.005;
  controls.update();
  composer.render();
}
loop();
</script></body></html>
